<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Our App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        button {
            width: 80%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        .guest-btn {
            background: #6c757d;
        }
        .guest-btn:hover {
            background: #5a6268;
        }
        p {
            margin-top: 15px;
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Saraswati Library</h1>
        <button onclick="location.href='login'">Login</button>
        <button class="guest-btn" onclick="guestLogin()">Guest Login</button>
        <p>Don't have an account? <a href="register">Register here</a></p>
    </div>

    <script>
        function guestLogin() {
            alert("Guest login initiated! Redirecting...");
            location.href = 'mainpage';
        }
    </script>
</body>
</html>
