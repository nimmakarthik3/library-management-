<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Library</title>
    <style>
           body {
    font-family: 'Roboto', sans-serif;
    background-color: #f3f4f6;
    margin: 0;
    padding: 0;
}


.header {
    background-color: #1e40af;
    color: white;
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
}

.header nav ul {
    list-style: none;
    display: flex;
    gap: 1rem;
}

.header nav a {
    color: white;
    text-decoration: none;
}

.header nav a:hover {
    text-decoration: underline;
}


.container {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 1rem;
}


h2 {
    font-size: 1.5rem;
    font-weight: bold;
    margin-bottom: 1rem;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
}

.card {
    background: white;
    padding: 1rem;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
}

.card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 5px;
}

.card h3 {
    font-size: 1.2rem;
    margin: 0.5rem 0;
}


.news {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.news-card {
    background: white;
    padding: 1rem;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}





.footer {
    background-color: #1e40af;
    color: white;
    text-align: center;
    padding: 1rem;
    margin-top: 2rem;
}
    </style>
    
</head>
<body class="bg-gray-100">
    <header class="header">
        <div class="container">
            <h1 class="title">Saraswati Library</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="/mainpage">Home</a></li>
                    <li><a href="authors">Authors</a></li>
                    <li><a href="books">books</a></li>
                    <li><a href="contact">Contact</a></li>
                    <li><a href="/">logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div>
            <h3 class="section-title">Contact Information</h3>
            <p>You can also reach us at:</p>
            <ul class="contact-info">
                <li><i class="fas fa-map-marker-alt"></i> 123 Library St, Booktown, BK 12345</li>
                <li><i class="fas fa-phone-alt"></i> (123) 456-7890</li>
                <li><i class="fas fa-envelope"></i> info@library.com</li>
            </ul>
            <h3 class="section-title">Follow Us</h3>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2023 Library. All rights reserved.</p>
    </footer>
</body>
</html>
